<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><body>
<p>你好，</p>
<p>有人（通常是你本人）请求把 HistoPilot.com 账号的邮箱改为 {{email}}。</p>
<p>请在 30 分钟内用当前已登录的账号打开下面的链接确认改绑：</p>
<p><a href="https://histopilot.com/verify-email-change?token={{token}}">确认邮箱改绑</a></p>
<p>如果按钮无法打开，请复制此链接到浏览器：https://histopilot.com/verify-email-change?token={{token}}</p>
<p>确认后，该邮箱将成为你的登录用户名，旧用户名立即失效，所有已登录设备需重新登录。</p>
<p>如果你没有请求过改绑，请忽略本邮件。不点击链接不会产生变更。</p>
</body></html>
